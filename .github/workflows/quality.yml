# -----------------------------------------------------------------------------
# Recurrence Ranger quality and linting
#
# The fast feedback half of the local pipeline: pinned tool versions, ruff
# formatting and lint, and mypy static analysis over src and scripts. It runs
# without the test suite so a formatting or typing regression is reported within
# a minute; the Local Pipeline workflow remains the complete gate.
# -----------------------------------------------------------------------------
name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, lint and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its pinned check tools
        run: python -m pip install -e '.[dev]'

      - name: Verify the pinned tool versions
        run: python scripts/tool_versions.py

      - name: Check formatting
        run: python -m ruff format --check --diff src tests scripts

      - name: Lint
        run: python -m ruff check --output-format github src tests scripts

      - name: Static analysis
        run: python -m mypy
