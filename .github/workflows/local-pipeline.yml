# -----------------------------------------------------------------------------
# Recurrence Ranger local pipeline
#
# Runs the very same verification that is run locally: ./localpipeline.sh checks
# the pinned tool versions, formatting, lint, static analysis, every test, a
# measured coverage report, the gate that requires more than 98% coverage, and
# the one-patch-per-commit version history. The full history is fetched because
# that last stage inspects every commit.
#
# It runs on the lowest Python the project claims to support and on the newest one,
# so requires-python in pyproject.toml is a checked promise rather than a hope.
# -----------------------------------------------------------------------------
name: Local Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-pipeline:
    name: Local pipeline replica (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the version used for development.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its pinned check tools
        run: python -m pip install -e '.[dev]'

      - name: Run the local pipeline
        run: ./localpipeline.sh

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json-python-${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: ignore
