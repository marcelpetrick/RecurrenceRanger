# -----------------------------------------------------------------------------
# Recurrence Ranger local pipeline
#
# Runs the very same verification that is run locally: ./localpipeline.sh checks
# the pinned tool versions, formatting, lint, static analysis, every test, a
# measured coverage report, the gate that requires more than 98% coverage, and
# the one-patch-per-commit version history. The full history is fetched because
# that last stage inspects every commit.
#
# It runs on the current stable Python series, matching requires-python.
# -----------------------------------------------------------------------------
name: Local Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-pipeline:
    name: Local pipeline replica (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The current stable series; setup-python selects its latest patch release.
        python-version: ["3.15"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version gate requires linear history, so check the PR head commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its pinned check tools
        run: python -m pip install -e '.[dev]'

      - name: Run the local pipeline
        run: ./localpipeline.sh

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json-python-${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: ignore
